apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-strato-vps
    group_by:
      - host
      - category
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord-raspberrypi
        object_matchers:
          - ["host", "=", "raspberrypi"]
      - receiver: discord-parents-pi
        object_matchers:
          - ["host", "=", "parents_pi"]
      - receiver: discord-strato-vps
        object_matchers:
          - ["host", "=", "strato_vps"]
