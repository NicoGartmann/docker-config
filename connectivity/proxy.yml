name: proxy

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: nginx-proxy-manager
    ports:
      - "80:80"
      - "443:443"
      - "81:81"       # Admin UI
    volumes:
      - "${NPM_DATA:-/opt/nginx-proxy-manager}/data:/data"
      - "${NPM_DATA:-/opt/nginx-proxy-manager}/letsencrypt:/etc/letsencrypt"
    restart: unless-stopped
