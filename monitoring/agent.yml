name: monitoring-agent

services:
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.13.0
    container_name: smartctl-exporter
    restart: unless-stopped
    privileged: true
    command:
      - "--smartctl.interval=15m"
      - "--smartctl.powermode-check=standby"
      - "--web.listen-address=:9633"

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: alloy
    restart: unless-stopped
    cgroup: host
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    environment:
      HOSTNAME: ${MONITORING_HOSTNAME:-raspberrypi}
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL:-https://prometheus.el-gartmanno.de/api/v1/write}
      PROMETHEUS_REMOTE_WRITE_USER: ${PROMETHEUS_REMOTE_WRITE_USER:-alloy}
      PROMETHEUS_REMOTE_WRITE_PASSWORD: ${PROMETHEUS_REMOTE_WRITE_PASSWORD}
    volumes:
      - "./config-agent.alloy:/etc/alloy/config.alloy:ro"
      - "${ALLOY_DATA:-/opt/alloy}:/var/lib/alloy/data"
      - "/:/rootfs:ro,rslave"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
      - "/proc:/host/proc:ro"
      - "/run/udev/data:/run/udev/data:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"
    devices:
      - "/dev/kmsg:/dev/kmsg:ro"
    depends_on:
      - smartctl-exporter
