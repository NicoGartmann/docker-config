name: monitoring-server

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "${PROMETHEUS_DATA:-/opt/prometheus}:/prometheus"
    networks:
      - default
      - proxy_default

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.el-gartmanno.de}
      DISCORD_WEBHOOK_RASPBERRYPI: ${DISCORD_WEBHOOK_RASPBERRYPI}
      DISCORD_WEBHOOK_PARENTS_PI: ${DISCORD_WEBHOOK_PARENTS_PI}
      DISCORD_WEBHOOK_STRATO_VPS: ${DISCORD_WEBHOOK_STRATO_VPS}
    volumes:
      - "${GRAFANA_DATA:-/opt/grafana}:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
    networks:
      - default
      - proxy_default

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    cgroup: host
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    environment:
      HOSTNAME: ${MONITORING_HOSTNAME:-strato_vps}
    volumes:
      - "./config-server.alloy:/etc/alloy/config.alloy:ro"
      - "${ALLOY_DATA:-/opt/alloy}:/var/lib/alloy/data"
      - "/:/rootfs:ro,rslave"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
      - "/proc:/host/proc:ro"
      - "/run/udev/data:/run/udev/data:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"
    devices:
      - "/dev/kmsg:/dev/kmsg:ro"
    depends_on:
      - prometheus

networks:
  proxy_default:
    external: true
