          title: |
            {{ if eq .Status "firing" }}🚨 [{{ .CommonLabels.category | toUpper }}] Problem auf {{ .CommonLabels.host }}{{ else }}✅ [{{ .CommonLabels.category | toUpper }}] Behoben auf {{ .CommonLabels.host }}{{ end }}
        disableResolveMessage: false

  - orgId: 1
    name: discord-strato-vps
    receivers:
      - uid: discord_strato_vps
        type: discord
